<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Panchang Match</title>

  <meta
    name="description"
    content="Calculate Panchang elements for any date and time."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --cream: #f8f0df;
      --paper: #fffaf0;
      --brown-dark: #3b1d0b;
      --brown: #6b3210;
      --gold: #b77a24;
      --gold-light: #d8a85d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
  min-height: 100vh;

  background:
    linear-gradient(
      rgba(248, 240, 223, 0.78),
      rgba(248, 240, 223, 0.78)
    ),
    url("/temple-bg.png") center top / cover fixed no-repeat;

  color: var(--brown-dark);
  font-family: "EB Garamond", Georgia, serif;
  overflow-x: hidden;
}

    .page-border {
      position: fixed;
      inset: 12px;
      border: 1px solid rgba(174,116,37,.55);
      pointer-events: none;
      z-index: 20;
    }

    .page-border::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(174,116,37,.2);
    }

    .page {
      width: min(1100px, 92%);
      margin: auto;
      min-height: 100vh;
      padding: 35px 20px 60px;
    }

    /* OM */

    .om-wrapper {
      width: 145px;
      height: 145px;
      margin: 0 auto 8px;
    }

    .om-logo {
      width: 100%;
      height: 100%;
    }

    .mandala-circle {
      fill: rgba(255,250,239,.7);
      stroke: var(--gold);
      stroke-width: 2;
    }

    .inner-circle {
      fill: none;
      stroke: var(--gold-light);
      stroke-width: 1.5;
    }

    .petals {
      fill: none;
      stroke: var(--gold);
      stroke-width: 2;
    }

    .om-symbol {
      font-family: "Noto Sans Devanagari", serif;
      font-size: 75px;
      fill: var(--brown);
    }

    /* HEADER */

    .hero {
      text-align: center;
      margin-bottom: 38px;
    }

    .hero h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(55px, 7vw, 85px);
      line-height: .9;
      font-weight: 600;
      color: var(--brown-dark);
    }

    .sanskrit {
      margin-top: 20px;
      color: var(--gold);
      font-family: "Noto Sans Devanagari", serif;
      font-size: 19px;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 22px;
      color: #694529;
    }

    /* CARD */

    .calculator-card {
      width: min(900px, 100%);
      margin: auto;
      padding: 35px 50px 30px;

      background:
        linear-gradient(
          135deg,
          rgba(255,251,241,.98),
          rgba(249,240,220,.98)
        );

      border: 1.5px solid var(--gold);
      border-radius: 24px;

      box-shadow:
        0 18px 45px rgba(72,39,13,.15);

      position: relative;
    }

    .calculator-card::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(183,122,36,.3);
      border-radius: 17px;
      pointer-events: none;
    }

    .decoration {
      text-align: center;
      color: var(--gold);
      font-size: 25px;
      margin-bottom: 25px;
    }

    /* INPUTS */

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
    }

    label {
      display: block;
      margin-bottom: 9px;

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 24px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 60px;

      padding: 0 18px;

      border-radius: 12px;
      border: 1.5px solid #d2aa72;

      background: #fffdf7;

      color: var(--brown-dark);

      font-family: "EB Garamond", Georgia, serif;
      font-size: 20px;

      outline: none;
    }

    input:focus {
      border-color: var(--gold);

      box-shadow:
        0 0 0 4px rgba(183,122,36,.12);
    }

    /* BUTTON */

    #calculateBtn {
      width: 100%;
      height: 68px;

      margin-top: 35px;

      border: 2px solid #8a470e;
      border-radius: 13px;

      background:
        linear-gradient(
          180deg,
          #a85816,
          #713108
        );

      color: #fff6e5;

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 27px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 6px 0 #542507,
        0 13px 25px rgba(91,42,8,.25);

      transition: .15s;
    }

    #calculateBtn:hover {
      transform: translateY(-2px);
    }

    #calculateBtn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #542507;
    }

    /* RESULTS */

    #resultSection {
      width: min(900px, 100%);
      margin: 45px auto 0;

      padding: 35px;

      background:
        linear-gradient(
          135deg,
          #fffaf0,
          #f5e9d0
        );

      border: 1.5px solid var(--gold);
      border-radius: 22px;

      box-shadow:
        0 18px 45px rgba(72,39,13,.15);
    }

    .result-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .result-om {
      font-family: "Noto Sans Devanagari", serif;
      font-size: 50px;
      color: var(--brown);
    }

    .result-header h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 48px;
    }

    .result-header p {
      font-size: 19px;
      color: #79563b;
    }

    .panchang-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;

      border: 1px solid #d5b27b;
      border-radius: 14px;
      overflow: hidden;
    }

    .panchang-item {
      padding: 24px;
      text-align: center;

      background: rgba(255,250,239,.7);

      border-bottom: 1px solid #dfc49b;
    }

    .panchang-item:nth-child(odd) {
      border-right: 1px solid #dfc49b;
    }

    .vara {
      grid-column: 1 / -1;
      border-right: none !important;
      border-bottom: none;
    }

    .item-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--gold);
    }

    .item-value {
      margin-top: 7px;

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 28px;
      font-weight: 700;
    }

    /* FOOTER */

    .bottom-text {
      text-align: center;
      margin-top: 45px;

      font-family: "Noto Sans Devanagari", serif;
      color: var(--gold);
      font-size: 18px;
      letter-spacing: 2px;
    }

    .credit {
      position: fixed;
      right: 28px;
      bottom: 18px;

      text-align: right;
      color: #6c4a2f;
    }

    .credit small {
      display: block;
      font-style: italic;
    }

    .credit strong {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 21px;
      font-style: italic;
    }

    .hidden {
      display: none !important;
    }
/* MATCH RESULTS */

#matchSection {
  width: min(900px, 100%);
  margin: 30px auto 0;
  padding: 35px;
  background: linear-gradient(
    135deg,
    #fffaf0,
    #f5e9d0
  );
  border: 1.5px solid var(--gold);
  border-radius: 22px;
  box-shadow: 0 18px 45px rgba(72,39,13,.15);
}

.match-header {
  text-align: center;
  margin-bottom: 25px;
}

.match-header h2 {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 42px;
}

.match-header p {
  color: #79563b;
  font-size: 18px;
}

.match-list {
  display: grid;
  gap: 14px;
}

.match-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 20px 24px;
  background: rgba(255,250,239,.8);
  border: 1px solid #d5b27b;
  border-radius: 14px;
  transition: .2s ease;
}

.match-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(72,39,13,.12);
}

.match-date {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 25px;
  font-weight: 700;
}

.match-time {
  margin-top: 3px;
  color: #79563b;
  font-size: 17px;
}

.match-score {
  min-width: 75px;
  padding: 8px 12px;
  border: 1px solid var(--gold);
  border-radius: 10px;
  text-align: center;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 23px;
  font-weight: 700;
  color: var(--brown);
  background: #fff7e7;
}

.no-matches {
  text-align: center;
  padding: 25px;
  color: #79563b;
  font-size: 19px;
}

@media (max-width: 700px) {
  #matchSection {
    padding: 20px 12px;
  }

  .match-card {
    padding: 16px;
  }

  .match-date {
    font-size: 21px;
  }

  .match-time {
    font-size: 15px;
  }
}
    /* MOBILE */

    @media (max-width: 700px) {

      .page {
        width: 94%;
        padding-top: 25px;
      }

      .om-wrapper {
        width: 115px;
        height: 115px;
      }

      .hero h1 {
        font-size: 48px;
      }

      .sanskrit {
        font-size: 15px;
      }

      .subtitle {
        font-size: 18px;
      }

      .calculator-card {
        padding: 28px 20px;
      }

      .input-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      #calculateBtn {
        font-size: 23px;
      }

      #resultSection {
        padding: 20px 12px;
      }

      .panchang-grid {
        grid-template-columns: 1fr;
      }

      .panchang-item {
        border-right: none !important;
      }

      .vara {
        grid-column: auto;
      }

      .credit {
        position: static;
        text-align: center;
        margin-top: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="page-border"></div>

  <main class="page">

    <header class="hero">

      <div class="om-wrapper">

        <svg
          class="om-logo"
          viewBox="0 0 180 180"
        >

          <circle
            cx="90"
            cy="90"
            r="68"
            class="mandala-circle"
          />

          <circle
            cx="90"
            cy="90"
            r="58"
            class="inner-circle"
          />

          <g class="petals">

            <path d="M90 8 C82 22 82 30 90 38 C98 30 98 22 90 8Z"/>
            <path d="M90 172 C82 158 82 150 90 142 C98 150 98 158 90 172Z"/>

            <path d="M8 90 C22 82 30 82 38 90 C30 98 22 98 8 90Z"/>
            <path d="M172 90 C158 82 150 82 142 90 C150 98 158 98 172 90Z"/>

            <path d="M32 32 C48 34 54 40 54 50 C44 50 36 44 32 32Z"/>
            <path d="M148 148 C132 146 126 140 126 130 C136 130 144 136 148 148Z"/>

            <path d="M148 32 C132 34 126 40 126 50 C136 50 144 44 148 32Z"/>
            <path d="M32 148 C48 146 54 140 54 130 C44 130 36 136 32 148Z"/>

          </g>

          <text
            x="90"
            y="120"
            text-anchor="middle"
            class="om-symbol"
          >ॐ</text>

        </svg>

      </div>

      <h1>Panchang Match</h1>

      <div class="sanskrit">
        ❖ ॥ सर्वे भवन्तु सुखिनः ॥ ❖
      </div>

      <p class="subtitle">
        Calculate Panchang elements for any date and time
      </p>

    </header>


    <section class="calculator-card">

      <div class="decoration">
        ───── ✧ ─────
      </div>

      <div class="input-grid">

        <div>

          <label for="date">
            ❖ Date ❖
          </label>

          <input
            type="date"
            id="date"
            value="2007-08-09"
          >

        </div>


        <div>

          <label for="time">
            ❖ Time ❖
          </label>

          <input
            type="time"
            id="time"
            value="14:30"
          >

        </div>

      </div>


      <button
        id="calculateBtn"
        type="button"
      >
        ❖ &nbsp; Calculate Panchang &nbsp; ❖
      </button>


      <div class="decoration" style="margin-top:25px;margin-bottom:0;">
        ───── ✧ ─────
      </div>

    </section>


    <section
      id="resultSection"
      class="hidden"
    >

      <div class="result-header">

        <div class="result-om">
          ॐ
        </div>

        <h2>Panchang</h2>

        <p id="resultDate"></p>

      </div>


      <div class="panchang-grid">

        <div class="panchang-item">

          <div class="item-title">
            TITHI
          </div>

          <div
            id="tithi"
            class="item-value"
          >
            —
          </div>

        </div>


        <div class="panchang-item">

          <div class="item-title">
            NAKSHATRA
          </div>

          <div
            id="nakshatra"
            class="item-value"
          >
            —
          </div>

        </div>


        <div class="panchang-item">

          <div class="item-title">
            YOGA
          </div>

          <div
            id="yoga"
            class="item-value"
          >
            —
          </div>

        </div>


        <div class="panchang-item">

          <div class="item-title">
            KARANA
          </div>

          <div
            id="karana"
            class="item-value"
          >
            —
          </div>

        </div>


        <div class="panchang-item vara">

          <div class="item-title">
            VARA
          </div>

          <div
            id="vara"
            class="item-value"
          >
            —
          </div>

        </div>

      </div>

    </section>

    <section id="matchesSection" class="hidden">

      <div class="result-header">

        <div class="result-om">
          ॐ
        </div>

        <h2>Yearly Matches</h2>

        <p>
          Dates with the closest Panchang combination
        </p>

      </div>

      <div id="matchesContainer"></div>

    </section>
    <div class="bottom-text">
      ॥ कालो हि दुरतिक्रमः ॥
    </div>


    <footer class="credit">

      <small>
        Designed by
      </small>

      <strong>
        Sidhartha Tharala
      </strong>

    </footer>

  </main>

<script>

const calculateBtn =
  document.getElementById("calculateBtn");

const resultSection =
  document.getElementById("resultSection");

const matchesSection =
  document.getElementById("matchesSection");

const matchesContainer =
  document.getElementById("matchesContainer");

const dateInput =
  document.getElementById("date");

const timeInput =
  document.getElementById("time");


calculateBtn.addEventListener("click", async () => {

  const date = dateInput.value;
  const time = timeInput.value;

  if (!date || !time) {
    alert("Please select both date and time.");
    return;
  }

  calculateBtn.textContent = "❖  Calculating...  ❖";
  calculateBtn.disabled = true;

  try {

    /*
     * 1. Get Panchang
     */

    const panchangResponse =
      await fetch(
        `/api/panchang?date=${encodeURIComponent(date)}&time=${encodeURIComponent(time)}`
      );

    if (!panchangResponse.ok) {
      throw new Error("Panchang API failed");
    }

    const panchangData =
      await panchangResponse.json();

    const panchang =
      panchangData.panchang;


    /*
     * 2. Display Panchang
     */

    document.getElementById("resultDate")
      .textContent =
      `${date.split("-").reverse().join("-")} • ${time}`;

    document.getElementById("tithi")
      .textContent =
      panchang.tithi?.name || "—";

    document.getElementById("nakshatra")
      .textContent =
      panchang.nakshatra?.name || "—";

    document.getElementById("yoga")
      .textContent =
      panchang.yoga?.name || "—";

    document.getElementById("karana")
      .textContent =
      panchang.karana?.name || "—";

    document.getElementById("vara")
      .textContent =
      panchang.vara?.name || "—";


    resultSection.classList.remove("hidden");


    /*
     * 3. Get yearly matches
     */

    matchesContainer.innerHTML =
      `<p style="text-align:center;font-size:20px;">
        Searching the year...
      </p>`;

    matchesSection.classList.remove("hidden");


    const matchesResponse =
      await fetch(
        `/api/matches?date=${encodeURIComponent(date)}&time=${encodeURIComponent(time)}`
      );

    if (!matchesResponse.ok) {
      throw new Error("Matches API failed");
    }

    const matchesData =
      await matchesResponse.json();

    const matches =
      matchesData.matches || [];


    /*
     * 4. Display matches
     */

    if (matches.length === 0) {

      matchesContainer.innerHTML = `
        <p style="
          text-align:center;
          font-size:20px;
          padding:25px;
        ">
          No matching dates found.
        </p>
      `;

    } else {

      matchesContainer.innerHTML =
        matches.map(match => {

          const score = match.score;

          let matchLabel;

          if (score === 5) {
            matchLabel = "Perfect Match";
          } else if (score === 4) {
            matchLabel = "Excellent Match";
          } else if (score === 3) {
            matchLabel = "Strong Match";
          } else {
            matchLabel = "Partial Match";
          }

          return `
            <div style="
              border:1px solid #d5b27b;
              border-radius:16px;
              padding:22px;
              margin-bottom:16px;
              background:rgba(255,250,239,.8);
              box-shadow:0 8px 20px rgba(72,39,13,.08);
            ">

              <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:15px;
                flex-wrap:wrap;
              ">

                <div>

                  <div style="
                    font-family:'Cormorant Garamond',serif;
                    font-size:27px;
                    font-weight:700;
                  ">
                    ${match.date}
                  </div>

                  <div style="
                    font-size:19px;
                    color:#79563b;
                    margin-top:4px;
                  ">
                    ${match.time}
                  </div>

                </div>


                <div style="
                  text-align:center;
                  min-width:95px;
                  padding:10px 15px;
                  border:1px solid #b77a24;
                  border-radius:12px;
                  background:#fffaf0;
                ">

                  <div style="
                    font-family:'Cormorant Garamond',serif;
                    font-size:25px;
                    font-weight:700;
                    color:#6b3210;
                  ">
                    ${score}/5
                  </div>

                  <div style="
                    font-size:14px;
                    color:#8a623f;
                  ">
                    ${matchLabel}
                  </div>

                </div>

              </div>


              <div style="
                display:flex;
                justify-content:center;
                gap:8px;
                flex-wrap:wrap;
                margin-top:18px;
              ">

                ${Object.entries(match.matches)
                  .map(([name, matched]) => `
                    <span style="
                      padding:5px 10px;
                      border-radius:20px;
                      font-size:14px;
                      border:1px solid ${matched ? "#b77a24" : "#c9bba5"};
                      background:${matched ? "#f3dfb9" : "#f1ece3"};
                      color:${matched ? "#6b3210" : "#887b6b"};
                    ">
                      ${name.toUpperCase()}
                      ${matched ? "✓" : "×"}
                    </span>
                  `)
                  .join("")}

              </div>

            </div>
          `;

        }).join("");

    }


    /*
     * 5. Scroll to results
     */

    resultSection.scrollIntoView({
      behavior: "smooth"
    });

  }

  catch (error) {

    console.error(error);

    alert(
      "Could not calculate Panchang. Check whether your server is running."
    );

  }

  finally {

    calculateBtn.textContent =
      "❖  Calculate Panchang  ❖";

    calculateBtn.disabled = false;

  }

});

</script>

</body>
</html>
